# IaC do Railway (.railway/railway.ts) em dois environments.
#
# Cada environment do GitHub (staging, production) guarda o secret
# RAILWAY_TOKEN com o project token do environment de mesmo nome no Railway.
# Secret de environment só é entregue a job que declara `environment:`, e o
# token é quem decide em qual environment do Railway o plan/apply roda.
#
#   PR para staging/production → plan no environment da branch de destino
#   push em staging/production → apply no environment da própria branch

name: Railway config

on:
  pull_request:
    branches: [staging, production]
    paths:
      - '.railway/**'
  push:
    branches: [staging, production]
    paths:
      - '.railway/**'

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  plan:
    name: Plan (${{ github.base_ref }})
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@v1
        with:
          command: plan
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    name: Apply (${{ github.ref_name }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    # Dois applies no mesmo environment não podem correr juntos: o segundo seria
    # rejeitado por StaleEnvironmentError no meio do caminho.
    concurrency:
      group: railway-apply-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: railwayapp/config@v1
        with:
          command: apply
          railway-token: ${{ secrets.RAILWAY_TOKEN }}
